# Only build/publish when the website itself changed (weekly post uploads must not use Netlify credits).
[build]
  publish = "wonder-kidz-studio/site"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- wonder-kidz-studio/site"

# The site moved to Cloudflare Pages. When Netlify deploys again, send everyone there.
[[redirects]]
  from = "/*"
  to = "https://wonderkidzstudio.pages.dev/:splat"
  status = 301
  force = true
