<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800;900&family=Figtree:wght@400;500;700;800&display=swap">
<style>
/* Layout: a snowy storybook. Pine-dark hero with the live book, then paper-white "pages" stacked like a crayon box: inside the book, the friends, free printables, shop, coming soon. Single bright look by choice. */
:root{
  --pine:#123b33;      /* hero night forest */
  --pine-2:#1c4d43;
  --snow:#fbf8f2;      /* page paper */
  --card:#ffffff;
  --ink:#1f2433;       /* crayon outline */
  --ink-soft:#575d70;
  --berry:#d7354a;     /* Pip's scarf, main action */
  --butter:#ffd257;    /* hidden star */
  --mint:#5fbf8f;      /* Juniper's beanie */
  --sky:#7cc4e8;       /* Waddles' winter sky */
  --line:#e7e0d2;
  --f-display:"Grandstander","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--snow);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pine)}
a{color:inherit}
:focus-visible{outline:3px solid var(--butter);outline-offset:3px;border-radius:10px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:900;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(1.9rem,4.6vw,2.7rem)}
h3{font-size:1.3rem;font-weight:800}
p{margin:0}
.eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.13em;font-size:.8rem;color:var(--berry)}
.section{padding-block:76px}
.head{display:grid;gap:10px;max-width:620px;margin-bottom:36px}
.head p{color:var(--ink-soft)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font:800 1.02rem var(--f-body);text-decoration:none;border-radius:14px;padding:13px 22px;border:3px solid var(--ink);background:var(--butter);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.berry{background:var(--berry);color:#fff}
.btn.plain{background:var(--card)}
.btn svg{width:20px;height:20px;flex:none}
.btn.soon,.btn.soon:hover{background:transparent;color:inherit;border-style:dashed;box-shadow:none;transform:none;cursor:default;opacity:.85}
.hero .btn.soon{border-color:#cfe3dc}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pine);color:#fff;border-bottom:3px solid var(--ink)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:900;font-size:1.3rem;line-height:1}
.logo svg{width:40px;height:40px;flex:none}
.logo small{display:block;font:700 .68rem var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--butter);margin-top:3px}
.nav ul{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.nav ul a{display:block;text-decoration:none;font-weight:700;font-size:.98rem;padding:8px 12px;border-radius:10px}
.nav ul a:hover{background:var(--pine-2)}
.nav .buy{background:var(--berry)}
.nav .buy:hover{background:#e04a5e}
@media (max-width:860px){.nav ul li:not(.keep){display:none}}

/* Hero */
.hero{background:var(--pine);color:#fff;position:relative;overflow:hidden}
.snow{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.6px,transparent 2px),radial-gradient(#fff 1.1px,transparent 1.5px);background-size:90px 90px,56px 56px;background-position:0 0,28px 30px;opacity:.35;animation:fall 18s linear infinite}
@keyframes fall{to{background-position:0 360px,28px 254px}}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;padding-block:60px 110px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--butter);color:var(--ink);font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px;border:2px solid var(--ink)}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--berry);display:block}
.hero h1{font-size:clamp(2.5rem,6.6vw,4.3rem);margin-top:18px}
.hero h1 span{color:var(--butter)}
.hero .lede{font-size:1.18rem;color:#d5ebe3;max-width:34ch;margin-top:18px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-weight:700;color:#d5ebe3;font-size:.98rem}
.facts b{color:#fff}
.hero .ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.paper-note{margin-top:18px;color:#d5ebe3;font-size:.98rem}.paper-note a{color:#fff;font-weight:700}
.price{font-family:var(--f-display);font-weight:900;font-size:1.05rem;margin-left:4px;padding-left:10px;border-left:2px solid rgba(255,255,255,.55)}
.hero-ground{position:absolute;left:0;right:0;bottom:-2px;height:70px;z-index:0}
.hero-ground svg{width:100%;height:100%;display:block}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-block:40px 96px;gap:34px}}

/* Book mockup */
.book3d{width:min(340px,82%);margin-inline:auto;aspect-ratio:8.5/11;max-width:100%;position:relative;transform:rotate(-3deg)}
.book3d .pages{position:absolute;inset:8px -10px -8px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px 12px 12px 4px}
.book3d .front{position:absolute;inset:0;border:3px solid var(--ink);border-radius:4px 12px 12px 4px;background:#e8f4fb;overflow:hidden;display:flex;flex-direction:column;box-shadow:12px 14px 0 rgba(0,0,0,.25)}
.book3d .front::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:4px;background:rgba(31,36,51,.15);z-index:2}
.cover-title{padding:16px 16px 0 22px;color:var(--ink);text-align:center;position:relative;z-index:1}
.cover-title .t{font-family:var(--f-display);font-weight:900;font-size:clamp(1.5rem,4.6vw,2.05rem);line-height:.95;color:var(--berry);-webkit-text-stroke:1px var(--ink)}
.cover-title .s{font-weight:800;font-size:clamp(.6rem,1.7vw,.74rem);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.cover-art{flex:1;min-height:0}
.cover-art svg{width:100%;height:100%;display:block}
.cover-brand{position:absolute;bottom:8px;left:0;right:0;text-align:center;font:800 .62rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#fff;z-index:1}

.cover-img,.book3d .front.cover-img{background:#e8f4fb url("/img/cozy-christmas-coloring-book-paperback.jpg") center/cover no-repeat}
/* Inside the book */
.inside{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.feat{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:8px;align-content:start}
.feat .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--ink)}
.feat .ic svg{width:30px;height:30px}
.feat p{color:var(--ink-soft);font-size:1rem}
@media (max-width:860px){.inside{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.inside{grid-template-columns:1fr}}

/* Friends */
.friends-band{background:#eef6f1;border-block:3px solid var(--ink)}
.friends{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.friend{display:grid;gap:8px;justify-items:center;text-align:center}
.friend .portrait{width:150px;height:150px;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 6px 0 var(--ink)}
.friend .portrait svg{width:112px;height:128px}
.friend h3{margin-top:10px}
.friend p{color:var(--ink-soft);font-size:1rem;max-width:30ch}
@media (max-width:700px){.friends{grid-template-columns:1fr}.friend{grid-template-columns:auto 1fr;justify-items:start;text-align:left;column-gap:18px}.friend .portrait{grid-row:span 2;width:104px;height:104px}.friend .portrait svg{width:78px;height:90px}.friend h3{margin-top:0;align-self:end}}

/* Shelf */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.title-card{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.title-card.live{box-shadow:0 6px 0 var(--ink)}
.title-card.upcoming{border-style:dashed;border-color:#b9b2a3}
.title-card .art{aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;border-bottom:3px solid var(--ink)}
.title-card.upcoming .art{border-bottom:3px dashed #b9b2a3}
.title-card .art svg{height:84%;width:auto}
.shelf-cover{background:#dceaf3}
.cover-img.mini{height:88%;aspect-ratio:8.5/11;max-width:100%;border:3px solid var(--ink);border-radius:3px 8px 8px 3px;box-shadow:6px 6px 0 rgba(31,36,51,.2)}
.title-card .body{padding:20px;display:grid;gap:8px;flex:1;align-content:start}
.title-card .body p{color:var(--ink-soft);font-size:.98rem}
.title-card .foot{padding:0 20px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.title-card .btn{font-size:.94rem;padding:10px 16px}
.tag{justify-self:start;font-weight:800;font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#f1ebde;color:var(--ink-soft)}
.tag.on{background:var(--berry);color:#fff}
.where{font-size:.88rem;font-weight:700;color:var(--ink-soft)}
@media (max-width:900px){.shelf{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.shelf{grid-template-columns:1fr}}

/* Free bundle */
.free-band{background:var(--butter);border-block:3px solid var(--ink)}
.free{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.free .eyebrow{color:var(--ink)}
.free h2{margin-top:8px}
.free .text p{margin-top:14px;max-width:46ch}
.free .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.bundle-list{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);padding:26px;box-shadow:0 6px 0 var(--ink);display:grid;gap:4px;min-width:0}
.bundle-list h3{margin-bottom:8px}
.bundle-list ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.bundle-list li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:2px dotted var(--line);font-weight:600}
.bundle-list li:last-child{border-bottom:0}
.bundle-list li span{color:var(--ink-soft);font-weight:500;font-size:.95rem;margin-left:auto;text-align:right}
.bundle-list .star{flex:none;width:18px;height:18px;align-self:center}
@media (max-width:820px){.free{grid-template-columns:1fr}}

/* Shop */
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pack{border:3px dashed #b9b2a3;border-radius:var(--r);padding:24px;display:grid;gap:10px;align-content:start;background:var(--card)}
.pack .sw{display:flex;gap:6px}
.pack .sw i{width:26px;height:10px;border-radius:999px;border:2px solid var(--ink);display:block}
.pack p{color:var(--ink-soft);font-size:1rem}
.shop-note{margin-top:26px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--ink-soft);font-weight:600}
.feature-pack{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:28px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 6px 0 var(--ink);padding:22px;margin-bottom:26px}
.feature-pack img{width:100%;height:auto;aspect-ratio:1/1;border:3px solid var(--ink);border-radius:12px;display:block}
.feature-pack .body{display:grid;gap:10px;align-content:start}
.feature-pack .body p{color:var(--ink-soft);font-size:1.02rem}
.feature-pack ul{margin:0;padding-left:1.2em;color:var(--ink-soft);display:grid;gap:4px}
.feature-pack .foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.feature-pack.bundle{border-color:var(--berry,#C62033);box-shadow:0 6px 0 var(--berry,#C62033);grid-template-columns:minmax(0,340px) 1fr;background:#FFF8F0}
.feature-pack img.wide{aspect-ratio:900/560;border:none;border-radius:12px}
@media (max-width:700px){.feature-pack.bundle{grid-template-columns:1fr}.feature-pack.bundle img.wide{max-width:100%}}
.save-badge{display:inline-block;background:#FFD257;color:#1F2433;font-weight:800;border:2px solid #1F2433;border-radius:999px;padding:3px 12px;font-size:.9rem;margin-left:6px}
.was{text-decoration:line-through;color:var(--ink-soft);font-weight:600}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-bottom:26px}
.product-grid .feature-pack{grid-template-columns:1fr;gap:14px;margin:0;padding:16px;align-items:stretch;display:flex;flex-direction:column}
.product-grid .feature-pack img{max-width:none;width:100%;margin:0}
.product-grid .feature-pack .body{flex:1;display:flex;flex-direction:column;gap:8px}
.product-grid .feature-pack h3{font-size:1.12rem;line-height:1.25}
.product-grid .feature-pack .tag{align-self:flex-start}
.product-grid .feature-pack .body p{font-size:.95rem}
.product-grid .feature-pack ul{font-size:.9rem}
.product-grid .feature-pack .foot{margin-top:auto;padding-top:6px}
@media (max-width:960px){.product-grid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.product-grid{grid-template-columns:1fr}}
.feature-pack img.tall{aspect-ratio:auto;width:min(100%,260px);margin-inline:auto}
@media (max-width:700px){.feature-pack{grid-template-columns:1fr;padding:18px}.feature-pack img{max-width:340px;margin-inline:auto}}
@media (max-width:860px){.shop{grid-template-columns:1fr}}

/* Coming soon */
.soon-band{background:var(--pine);color:#fff}
.soon-band .head p{color:#cfe3dc}
.soon-band .eyebrow{color:var(--butter)}
.soons{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.soon-item{border:2px dashed #6f9a8e;border-radius:var(--r);padding:22px;display:grid;gap:8px;align-content:start}
.soon-item .when{font-weight:800;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--butter)}
.soon-item p{color:#cfe3dc;font-size:.98rem}
.soon-item.live{border:2px solid var(--butter);background:rgba(255,210,87,.08)}
.sub-btn{justify-self:start;margin-top:6px;background:var(--butter);color:#1f2433;font-size:.94rem;padding:10px 18px}
.sub-row{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sub-row span{color:var(--ink-soft);font-weight:600;font-size:.95rem}
@media (max-width:960px){.soons{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.soons{grid-template-columns:1fr}}

/* Socials */
.follow{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.socials{display:flex;flex-wrap:wrap;gap:12px}
.social{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:800 1rem var(--f-body);padding:11px 18px;border-radius:14px;border:3px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.social:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.social i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block;flex:none}
.social.off,.social.off:hover{border-style:dashed;border-color:#b9b2a3;box-shadow:none;transform:none;color:var(--ink-soft);cursor:default}
.social.off small{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
@media (max-width:760px){.follow{grid-template-columns:1fr}}

/* Grown-ups */
.grown{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.grown div{display:grid;gap:6px;align-content:start}
.grown h3{font-size:1.15rem}
.grown p{color:var(--ink-soft);font-size:1rem}
@media (max-width:820px){.grown{grid-template-columns:1fr}}

/* Paperback (single) */
.shelf.single{grid-template-columns:minmax(0,380px) 1fr;align-items:center}
.shelf-note{display:grid;gap:12px;justify-items:start;max-width:42ch}
.shelf-note p{color:var(--ink-soft)}
@media (max-width:700px){.shelf.single{grid-template-columns:1fr}}

/* Parents */
.parents-band{background:#fdeef0;border-block:3px solid var(--ink)}

footer{background:#e7f0ec;border-top:3px solid var(--ink)}
footer .wrap{padding-block:36px;display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center;font-weight:600;font-size:.95rem;color:var(--ink-soft)}
footer .logo{color:var(--ink)}
footer .logo small{color:var(--berry)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px}
footer nav a{text-decoration:none;font-weight:700;color:var(--ink)}
footer nav a:hover{text-decoration:underline}
</style>
